# ============================================================
# Simulación local del cluster de 5 máquinas sobre una red bridge
# estática y personalizada (192.168.100.0/24), replicando las IPs
# fijas que tendría el despliegue real bare-metal (ver deploy/).
# ============================================================
version: "3.9"

networks:
  banking-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:

  # ---------- MÁQUINA 1: 192.168.100.10 ----------
  api-gateway:
    build: ./services/api-gateway
    hostname: api-gateway
    networks:
      banking-net:
        ipv4_address: 192.168.100.10
    ports:
      - "8080:8080"
    environment:
      LOAD_BALANCER_URL: http://load-balancer:9000
    depends_on: [load-balancer]

  load-balancer:
    build: ./services/load-balancer
    hostname: load-balancer
    networks:
      banking-net:
        ipv4_address: 192.168.100.11
    environment:
      CIRCUIT_BREAKER_URL: http://circuit-breaker:9100
      MONITOR_URL: http://monitor:8500
    depends_on: [circuit-breaker]

  circuit-breaker:
    build: ./services/circuit-breaker
    hostname: circuit-breaker
    networks:
      banking-net:
        ipv4_address: 192.168.100.12

  # ---------- MÁQUINA 2: 192.168.100.20 (PRIMARY) ----------
  postgres-primary:
    build: ./docker/postgres
    hostname: postgres-primary
    networks:
      banking-net:
        ipv4_address: 192.168.100.20
    environment:
      POSTGRES_ROLE: primary
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass
      REPLICATOR_PASSWORD: replica_pass
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./config/postgresql/primary.conf:/etc/postgresql/primary.conf:ro

  transaction-service-2:
    build: ./services/transaction-service
    hostname: transaction-service-2
    networks:
      banking-net:
        ipv4_address: 192.168.100.21
    environment:
      NODE_ID: node-2
      NODE_ROLE: PRIMARY
      DB_HOST: postgres-primary
      DB_NAME: banking
      DB_USER: banking_user
      DB_PASSWORD: banking_pass
      WAL_PATH: /data/wal/transactions.wal
      MONITOR_URL: http://monitor:8500
    volumes:
      - wal_node2:/data/wal
    depends_on: [postgres-primary]

  # ---------- MÁQUINA 3: 192.168.100.22 (REPLICA 1) ----------
  postgres-replica-1:
    build: ./docker/postgres
    hostname: postgres-replica-1
    networks:
      banking-net:
        ipv4_address: 192.168.100.22
    environment:
      POSTGRES_ROLE: replica
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass
    volumes:
      - pg_replica1_data:/var/lib/postgresql/data
    depends_on: [postgres-primary]

  transaction-service-3:
    build: ./services/transaction-service
    hostname: transaction-service-3
    networks:
      banking-net:
        ipv4_address: 192.168.100.23
    environment:
      NODE_ID: node-3
      NODE_ROLE: REPLICA
      DB_HOST: postgres-replica-1
      DB_NAME: banking
      DB_USER: banking_user
      DB_PASSWORD: banking_pass
      WAL_PATH: /data/wal/transactions.wal
      MONITOR_URL: http://monitor:8500
    volumes:
      - wal_node3:/data/wal
    depends_on: [postgres-replica-1]

  # ---------- MÁQUINA 4: 192.168.100.24 (REPLICA 2) ----------
  postgres-replica-2:
    build: ./docker/postgres
    hostname: postgres-replica-2
    networks:
      banking-net:
        ipv4_address: 192.168.100.24
    environment:
      POSTGRES_ROLE: replica
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
    depends_on: [postgres-primary]

  transaction-service-4:
    build: ./services/transaction-service
    hostname: transaction-service-4
    networks:
      banking-net:
        ipv4_address: 192.168.100.25
    environment:
      NODE_ID: node-4
      NODE_ROLE: REPLICA
      DB_HOST: postgres-replica-2
      DB_NAME: banking
      DB_USER: banking_user
      DB_PASSWORD: banking_pass
      WAL_PATH: /data/wal/transactions.wal
      MONITOR_URL: http://monitor:8500
    volumes:
      - wal_node4:/data/wal
    depends_on: [postgres-replica-2]

  # ---------- MÁQUINA 5: 192.168.100.30 ----------
  monitor:
    build: ./services/monitor
    hostname: monitor
    networks:
      banking-net:
        ipv4_address: 192.168.100.30
    ports:
      - "8500:8500"
    volumes:
      - monitor_logs:/data/logs

volumes:
  pg_primary_data:
  pg_replica1_data:
  pg_replica2_data:
  wal_node2:
  wal_node3:
  wal_node4:
  monitor_logs:
