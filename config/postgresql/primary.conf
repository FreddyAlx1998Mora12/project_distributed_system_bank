# ============================================================
# postgresql.conf -- NODO PRIMARY (Máquina 2, 192.168.1.20)
# Habilita WAL en modo 'replica' para permitir streaming replication
# hacia los nodos réplica (Máquinas 3 y 4).
# ============================================================

listen_addresses = '*'
port = 5432

# --- Write-Ahead Log ---
wal_level = replica              # necesario para replicación física
max_wal_senders = 5              # conexiones concurrentes de réplicas (2 réplicas + margen)
wal_keep_size = 512MB            # WAL retenido para réplicas que se reconectan
max_replication_slots = 5

# --- Replicación por slots (evita perder WAL si una réplica se desconecta) ---
hot_standby = on

# --- Checkpoints (impacta cuánto WAL se retiene entre checkpoints) ---
checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB

# --- Autenticación de réplicas ---
# En pg_hba.conf debe existir:
#   host replication replicator 192.168.1.21/32 scram-sha-256
#   host replication replicator 192.168.1.22/32 scram-sha-256

archive_mode = off               # simulación local; en producción -> on + archive_command
