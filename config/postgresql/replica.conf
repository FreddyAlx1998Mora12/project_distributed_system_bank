# ============================================================
# postgresql.conf -- NODOS REPLICA (Máquinas 3 y 4)
# Configura streaming replication en modo hot standby (lecturas
# permitidas mientras recibe el WAL del primary en tiempo real).
# ============================================================

listen_addresses = '*'
port = 5432

wal_level = replica
hot_standby = on                 # permite SELECT mientras aplica WAL recibido

# standby.signal debe existir en el data directory para arrancar en modo réplica
# primary_conninfo se define vía variables de entorno del contenedor:
#   host=192.168.1.20 port=5432 user=replicator password=... application_name=node-3

recovery_min_apply_delay = 0     # sin retraso artificial; podría usarse para réplica "delayed" de auditoría
max_standby_streaming_delay = 30s
