spring.application.name=quorum-monitor-service

# ===========================================
# Monitor Service - Configuración
# ===========================================

# Server
server.port=8500

# Cluster Nodes (Mapeados exactamente a transaction-service-2, 3 y 4)
cluster.nodes[0].id=node-2
cluster.nodes[0].url=http://transaction-service-2:8080
cluster.nodes[0].priority=1

cluster.nodes[1].id=node-3
cluster.nodes[1].url=http://transaction-service-3:8080
cluster.nodes[1].priority=2

cluster.nodes[2].id=node-4
cluster.nodes[2].url=http://transaction-service-4:8080
cluster.nodes[2].priority=3

# Health Check Configuration
cluster.health-check.interval-ms=2000
cluster.health-check.timeout-ms=1000
cluster.health-check.failure-threshold=2
cluster.health-check.recovery-threshold=2

# Actuator
management.endpoints.web.exposure.include=health,info